<!doctype html><html lang="es"><head><meta charset="utf-8"><style>
@page { size: A4 landscape; margin: 22mm 12mm 18mm; @top-left { content: "CLIMATE MONITORING SYSTEM"; font-size: 9pt; color: #155e75; } @bottom-left { content: "Información de las APIs de dominio · Uso autorizado"; font-size: 8pt; color: #475569; } @bottom-right { content: "Página " counter(page) " de " counter(pages); font-size: 8pt; } }
body { font-family: sans-serif; font-size: 9pt; color: #0f172a; } header { border-bottom: 3px solid #0e7490; padding-bottom: 12px; margin-bottom: 18px; } .logo { display: inline-block; background: #0e7490; color: white; border-radius: 8px; padding: 10px; font-size: 20pt; font-weight: bold; } h1 { font-size: 23pt; margin: 10px 0; } h2 { color: #155e75; font-size: 14pt; margin-top: 18px; } table { width: 100%; border-collapse: collapse; table-layout: fixed; } thead { display: table-header-group; } th { background: #155e75; color: white; text-align: left; } th,td { border: 1px solid #cbd5e1; padding: 6px; overflow-wrap: anywhere; vertical-align: top; } tr { break-inside: avoid; } tbody tr:nth-child(even) { background: #f1f5f9; } .note { color: #475569; font-size: 8pt; } footer { margin-top: 16px; border-top: 1px solid #cbd5e1; }
</style><title>{{ title }}</title></head><body>
<header><span class="logo" aria-label="Logo Climate Monitoring">CM</span><h1>{{ title }}</h1><p>Generado: {{ generated_at }} · Usuario: {{ user_name }} · Zona horaria: {{ timezone }}</p><p class="note">Parámetros aplicados: {{ parameters }}</p></header>
