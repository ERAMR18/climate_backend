apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: climate-monitoring
  labels:
    app.kubernetes.io/part-of: climate-monitoring
data:
  ASPNETCORE_ENVIRONMENT: Production
  ASPNETCORE_HTTP_PORTS: '8080'
  Cors__AllowedOrigins__0: http://frontend.example.invalid
  ReverseProxy__Clusters__identity__Destinations__primary__Address: http://identity-service:8080/
  DownstreamHealthEndpoints__0: http://identity-service:8080/health
  ReverseProxy__Clusters__sensors__Destinations__primary__Address: http://sensor-service:8080/
  DownstreamHealthEndpoints__1: http://sensor-service:8080/health
  ReverseProxy__Clusters__monitoring__Destinations__primary__Address: http://monitoring-service:8080/
  DownstreamHealthEndpoints__2: http://monitoring-service:8080/health
  ReverseProxy__Clusters__alerts__Destinations__primary__Address: http://alert-service:8080/
  DownstreamHealthEndpoints__3: http://alert-service:8080/health
  ReverseProxy__Clusters__events__Destinations__primary__Address: http://event-service:8080/
  DownstreamHealthEndpoints__4: http://event-service:8080/health
  ReverseProxy__Clusters__audit__Destinations__primary__Address: http://audit-service:8080/
  DownstreamHealthEndpoints__5: http://audit-service:8080/health
  ReverseProxy__Routes__communities__ClusterId: communities
  ReverseProxy__Routes__communities__AuthorizationPolicy: Default
  ReverseProxy__Routes__communities__Match__Path: /api/communities/{**remainder}
  ReverseProxy__Routes__communities__Transforms__0__PathRemovePrefix: /api/communities
  ReverseProxy__Routes__communities__Transforms__1__PathPrefix: /api/v1/communities
  ReverseProxy__Clusters__communities__Destinations__primary__Address: http://community-service:8080/
  DownstreamHealthEndpoints__6: http://community-service:8080/health
  ReverseProxy__Routes__reports__ClusterId: reports
  ReverseProxy__Routes__reports__AuthorizationPolicy: Default
  ReverseProxy__Routes__reports__Match__Path: /api/reports/{**remainder}
  ReverseProxy__Routes__reports__Transforms__0__PathRemovePrefix: /api/reports
  ReverseProxy__Routes__reports__Transforms__1__PathPrefix: /api/v1/reports
  ReverseProxy__Clusters__reports__Destinations__primary__Address: http://report-service:8080/
  DownstreamHealthEndpoints__7: http://report-service:8080/health
