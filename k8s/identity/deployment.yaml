apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity
  namespace: climate-monitoring
  labels:
    app.kubernetes.io/part-of: climate-monitoring
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels: &id001
      app.kubernetes.io/name: identity
      app.kubernetes.io/part-of: climate-monitoring
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 1000
      containers:
      - name: identity
        image: climate/auth:phase3
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        envFrom:
        - configMapRef:
            name: climate-config
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 1000m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        startupProbe:
          httpGet:
            path: /health/live
            port: http
          periodSeconds: 5
          failureThreshold: 60
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 3
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        env:
        - name: JWT_SIGNING_KEY
          valueFrom:
            secretKeyRef:
              name: climate-secrets
              key: JWT_SIGNING_KEY
        - name: INTERNAL_API_KEY
          valueFrom:
            secretKeyRef:
              name: climate-secrets
              key: INTERNAL_API_KEY
        - name: AUTH_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: climate-secrets
              key: AUTH_DATABASE_URL
        - name: RABBITMQ_URL
          valueFrom:
            secretKeyRef:
              name: climate-secrets
              key: RABBITMQ_URL
        - name: NODE_ENV
          value: production
        - name: PORT
          value: '8080'
      volumes:
      - name: tmp
        emptyDir: {}
