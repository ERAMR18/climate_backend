apiVersion: apps/v1
kind: Deployment
metadata:
  name: events
  namespace: climate-monitoring
  labels:
    app.kubernetes.io/part-of: climate-monitoring
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels: &id001
      app.kubernetes.io/name: events
      app.kubernetes.io/part-of: climate-monitoring
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: events
        image: climate/events:phase2
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        envFrom:
        - configMapRef:
            name: climate-config
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 1000m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        startupProbe:
          httpGet:
            path: /health/live
            port: http
          periodSeconds: 5
          failureThreshold: 60
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 3
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        env:
        - name: Jwt__SigningKey
          valueFrom:
            secretKeyRef:
              name: climate-secrets
              key: JWT_SIGNING_KEY
        - name: ConnectionStrings__EventDb
          valueFrom:
            secretKeyRef:
              name: climate-secrets
              key: SQL_EVENTS_CONNECTION
        - name: RABBITMQ_USER
          valueFrom:
            secretKeyRef:
              name: climate-secrets
              key: RABBITMQ_USER
        - name: RABBITMQ_PASSWORD
          valueFrom:
            secretKeyRef:
              name: climate-secrets
              key: RABBITMQ_PASSWORD
        - name: InternalApi__ApiKey
          valueFrom:
            secretKeyRef:
              name: climate-secrets
              key: INTERNAL_API_KEY
      volumes:
      - name: tmp
        emptyDir: {}
