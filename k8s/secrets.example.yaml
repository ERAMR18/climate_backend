apiVersion: v1
kind: Secret
metadata:
  name: climate-secrets
  namespace: climate-monitoring
  labels:
    app.kubernetes.io/part-of: climate-monitoring
type: Opaque
stringData:
  JWT_SIGNING_KEY: REPLACE_WITH_RANDOM_SIGNING_KEY_AT_LEAST_32_CHARS
  INTERNAL_API_KEY: REPLACE_WITH_RANDOM_INTERNAL_KEY_AT_LEAST_32_CHARS
  RABBITMQ_USER: REPLACE_WITH_BROKER_USER
  RABBITMQ_PASSWORD: REPLACE_WITH_BROKER_PASSWORD
  RABBITMQ_ERLANG_COOKIE: REPLACE_WITH_RANDOM_ERLANG_COOKIE
  SQL_SENSORS_CONNECTION: Server=sql-host.example.invalid,1433;Database=SensorDb;User
    Id=REPLACE_WITH_SQL_USER;Password=REPLACE_WITH_SQL_PASSWORD;Encrypt=True;TrustServerCertificate=True
  SQL_MONITORING_CONNECTION: Server=sql-host.example.invalid,1433;Database=MonitoringDb;User
    Id=REPLACE_WITH_SQL_USER;Password=REPLACE_WITH_SQL_PASSWORD;Encrypt=True;TrustServerCertificate=True
  SQL_EVENTS_CONNECTION: Server=sql-host.example.invalid,1433;Database=EventDb;User
    Id=REPLACE_WITH_SQL_USER;Password=REPLACE_WITH_SQL_PASSWORD;Encrypt=True;TrustServerCertificate=True
  AUTH_DATABASE_URL: REPLACE_WITH_PRIVATE_AUTH_DATABASE_URL
  COMMUNITY_DATABASE_CONNECTION: REPLACE_WITH_PRIVATE_COMMUNITY_DATABASE_CONNECTION
  ALERT_DATABASE_URL: REPLACE_WITH_PRIVATE_ALERT_DATABASE_URL
  ALERT_DATABASE_USER: REPLACE_WITH_PRIVATE_ALERT_DATABASE_USER
  ALERT_DATABASE_PASSWORD: REPLACE_WITH_PRIVATE_ALERT_DATABASE_PASSWORD
  AUDIT_MONGO_URL: REPLACE_WITH_PRIVATE_AUDIT_MONGO_URL
  REPORT_MONGO_URL: REPLACE_WITH_PRIVATE_REPORT_MONGO_URL
  RABBITMQ_URL: REPLACE_WITH_PRIVATE_RABBITMQ_URL
