# Combine with docker-compose.yml. Requires the Hostinger Traefik project.
services:
  sqlserver:
    ports: !reset []
  gateway:
    ports: !reset []
    environment:
      Cors__AllowedOrigins__0: https://${CLIMATE_DOMAIN:-analisissistemas2026proyecto.xyz}
    labels:
      - traefik.enable=true
      - traefik.docker.network=climate-monitoring-backend
      - traefik.http.routers.climate-api.rule=Host(`${CLIMATE_DOMAIN:-analisissistemas2026proyecto.xyz}`) && (PathPrefix(`/api/`) || Path(`/api`) || PathPrefix(`/hubs/`) || Path(`/hubs`))
      - traefik.http.routers.climate-api.priority=100
      - traefik.http.routers.climate-api.entrypoints=websecure
      - traefik.http.routers.climate-api.tls=true
      - traefik.http.routers.climate-api.tls.certresolver=letsencrypt
      - traefik.http.routers.climate-api.service=climate-api
      - traefik.http.services.climate-api.loadbalancer.server.port=8080

networks:
  backend:
    name: climate-monitoring-backend
