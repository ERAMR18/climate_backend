# Isolated integration fixtures. Never load application .env in this project.
name: climate-phase3-auth-validation
services:
  mongo:
    image: mongo:8.0
    profiles: [audit]
    environment:
      MONGO_INITDB_ROOT_USERNAME: audit
      MONGO_INITDB_ROOT_PASSWORD: ${PHASE3_TEST_POSTGRES_PASSWORD:?test password required}
    ports: ["127.0.0.1:15417:27017"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 3s
      timeout: 5s
      retries: 30
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: auth
      POSTGRES_DB: auth
      POSTGRES_PASSWORD: ${PHASE3_TEST_POSTGRES_PASSWORD:?test password required}
    ports: ["127.0.0.1:15432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d auth"]
      interval: 3s
      timeout: 3s
      retries: 30
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${PHASE3_TEST_SQL_PASSWORD:?test password required}
    ports: ["127.0.0.1:15433:1433"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 10s
  rabbitmq:
    image: rabbitmq:4.1-management
    hostname: phase3-auth-validation
    environment:
      RABBITMQ_DEFAULT_USER: test
      RABBITMQ_DEFAULT_PASS: ${PHASE3_TEST_RABBIT_PASSWORD:?test password required}
    ports: ["127.0.0.1:15672:5672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 3s
      timeout: 5s
      retries: 30
