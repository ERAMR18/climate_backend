services:
  frontend:
    restart: unless-stopped
    build:
      context: ../frontend/climate-monitoring-web
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 4200
      GATEWAY_PUBLIC_URL: ${GATEWAY_PUBLIC_URL:-http://localhost:8080}
      GATEWAY_INTERNAL_URL: http://gateway:8080
    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-4200}:4200"
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD","node","-e","fetch('http://127.0.0.1:4200/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
