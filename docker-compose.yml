# Complete Phase 3 default stack. Generated by scripts/update-phase3-compose.ps1.
# Edit the phase3 overlays, then regenerate. Variables remain unresolved references.
name: climate-monitoring
networks:
  default:
services:
  alert-postgres:
    environment:
      POSTGRES_DB: alerts
      POSTGRES_PASSWORD: ${ALERT_POSTGRES_PASSWORD:?ALERT_POSTGRES_PASSWORD is required}
      POSTGRES_USER: alerts
    healthcheck:
      interval: 10s
      retries: 10
      test:
        - CMD-SHELL
        - pg_isready -U alerts -d alerts
      timeout: 5s
    image: postgres:16-alpine
    networks:
      default: null
    restart: unless-stopped
    volumes:
      - source: alert-postgres-data
        target: /var/lib/postgresql/data
        type: volume
        volume: {}
  alert-service:
    build:
      context: src\Services\AlertServiceJava
      dockerfile: Dockerfile
    depends_on:
      alert-postgres:
        condition: service_healthy
        required: true
    environment:
      ALERT_DATABASE_PASSWORD: ${ALERT_POSTGRES_PASSWORD:?ALERT_POSTGRES_PASSWORD is required}
      ALERT_DATABASE_URL: jdbc:postgresql://alert-postgres:5432/alerts
      ALERT_DATABASE_USER: alerts
      EVENT_SERVICE_URL: http://event-service:8080/
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required}
      JWT_AUDIENCE: ClimateMonitoring.Client
      JWT_ISSUER: ClimateMonitoring.Identity
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY is required}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      RABBITMQ_USER: ${RABBITMQ_USER:?RABBITMQ_USER is required}
      REALTIME_SERVICE_URL: http://monitoring-service:8080/
      SENSOR_SERVICE_URL: http://sensor-service:8080/
    healthcheck:
      interval: 15s
      retries: 10
      start_period: 30s
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://localhost:8080/health/ready
      timeout: 5s
    image: climate/alerts:phase3
    networks:
      default: null
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
  audit-mongo:
    environment:
      MONGO_INITDB_ROOT_PASSWORD: ${AUDIT_MONGO_PASSWORD:?AUDIT_MONGO_PASSWORD is required}
      MONGO_INITDB_ROOT_USERNAME: audit
    healthcheck:
      interval: 10s
      retries: 10
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - 'quit(db.adminCommand(''ping'').ok ? 0 : 1)'
      timeout: 5s
    image: mongo:8.0
    networks:
      default: null
    restart: unless-stopped
    volumes:
      - source: audit-mongo-data
        target: /data/db
        type: volume
        volume: {}
  audit-service:
    build:
      context: .
      dockerfile: src/Services/AuditServicePython/Dockerfile
    depends_on:
      audit-mongo:
        condition: service_healthy
        required: true
    environment:
      JWT_AUDIENCE: ClimateMonitoring.Client
      JWT_ISSUER: ClimateMonitoring.Identity
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY is required}
      MONGO_DATABASE: audit
      MONGO_URL: mongodb://audit:${AUDIT_MONGO_PASSWORD_URI:?URL-encoded audit Mongo password is required}@audit-mongo:27017/?authSource=admin
      RABBITMQ_URL: amqp://${RABBITMQ_USER_URI:?URL-encoded username is required}:${RABBITMQ_PASSWORD_URI:?URL-encoded password is required}@rabbitmq:5672/
    healthcheck:
      interval: 15s
      retries: 10
      start_period: 30s
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8080/health/ready', timeout=3)
      timeout: 5s
    image: climate/audit:phase3
    networks:
      default: null
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
  auth-postgres:
    environment:
      POSTGRES_DB: auth
      POSTGRES_PASSWORD: ${AUTH_POSTGRES_PASSWORD:?AUTH_POSTGRES_PASSWORD is required}
      POSTGRES_USER: auth
    healthcheck:
      interval: 10s
      retries: 10
      test:
        - CMD-SHELL
        - pg_isready -U auth -d auth
      timeout: 5s
    image: postgres:16-alpine
    networks:
      default: null
    restart: unless-stopped
    volumes:
      - source: auth-postgres-data
        target: /var/lib/postgresql/data
        type: volume
        volume: {}
  community-postgres:
    environment:
      POSTGRES_DB: community
      POSTGRES_PASSWORD: ${COMMUNITY_POSTGRES_PASSWORD:?COMMUNITY_POSTGRES_PASSWORD is required}
      POSTGRES_USER: community
    healthcheck:
      interval: 10s
      retries: 10
      test:
        - CMD-SHELL
        - pg_isready -U community -d community
      timeout: 5s
    image: postgres:16-alpine
    networks:
      default: null
    restart: unless-stopped
    volumes:
      - source: community-postgres-data
        target: /var/lib/postgresql/data
        type: volume
        volume: {}
  community-service:
    build:
      context: .
      dockerfile: src/Services/CommunityService/Climate.Communities.Api/Dockerfile
    depends_on:
      community-postgres:
        condition: service_healthy
        required: true
    environment:
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__CommunityDb: Host=community-postgres;Database=community;Username=community;Password=${COMMUNITY_POSTGRES_PASSWORD}
      InternalApi__ApiKey: ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required}
      Jwt__Audience: ClimateMonitoring.Client
      Jwt__Issuer: ClimateMonitoring.Identity
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY is required}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      RABBITMQ_USER: ${RABBITMQ_USER:?RABBITMQ_USER is required}
      SensorService__BaseUrl: http://sensor-service:8080/
    healthcheck:
      interval: 15s
      retries: 10
      test:
        - CMD
        - dotnet
        - /app/health/Climate.HealthProbe.dll
        - http://localhost:8080/health/ready
      timeout: 5s
    image: climate/community:phase3
    networks:
      default: null
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
  event-service:
    build:
      context: .
      dockerfile: src/Services/EventService/Climate.Events.Api/Dockerfile
    depends_on:
      sqlserver:
        condition: service_healthy
        required: true
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__EventDb: Server=sqlserver,1433;Database=EventDb;User Id=sa;Password=${SQLSERVER_SA_PASSWORD};TrustServerCertificate=True;Encrypt=True
      InternalApi__ApiKey: ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required}
      Jwt__Audience: ClimateMonitoring.Client
      Jwt__Issuer: ClimateMonitoring.Identity
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY is required}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:?RABBITMQ_USER is required}
    healthcheck:
      interval: 15s
      retries: 10
      start_period: 30s
      test:
        - CMD
        - dotnet
        - /app/health/Climate.HealthProbe.dll
      timeout: 5s
    image: climate/events:phase3
    networks:
      default: null
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
  frontend:
    build:
      context: ..\frontend\climate-monitoring-web
      dockerfile: Dockerfile
    environment:
      GATEWAY_INTERNAL_URL: http://gateway:8080
      GATEWAY_PUBLIC_URL: ${GATEWAY_PUBLIC_URL:-http://localhost:8080}
      NODE_ENV: production
      PORT: 4200
    healthcheck:
      interval: 15s
      retries: 10
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:4200/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      timeout: 5s
    image: climate/frontend:phase3
    networks:
      default: null
    ports:
      - ${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-4200}:4200
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
  gateway:
    build:
      context: .
      dockerfile: src/Gateway/Climate.Gateway/Dockerfile
    depends_on:
      alert-service:
        condition: service_healthy
        required: true
      event-service:
        condition: service_healthy
        required: true
      identity-service:
        condition: service_healthy
        required: true
      monitoring-service:
        condition: service_healthy
        required: true
      sensor-service:
        condition: service_healthy
        required: true
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=8080
      - Cors__AllowedOrigins__0=${FRONTEND_ORIGIN:-http://localhost:4200}
      - DownstreamHealthEndpoints__0=http://identity-service:8080/health
      - DownstreamHealthEndpoints__1=http://sensor-service:8080/health
      - DownstreamHealthEndpoints__2=http://monitoring-service:8080/health
      - DownstreamHealthEndpoints__3=http://alert-service:8080/health
      - DownstreamHealthEndpoints__4=http://event-service:8080/health
      - DownstreamHealthEndpoints__5=http://audit-service:8080/health
      - Jwt__Audience=ClimateMonitoring.Client
      - Jwt__Issuer=ClimateMonitoring.Identity
      - Jwt__SigningKey=${JWT_SIGNING_KEY:?JWT_SIGNING_KEY is required}
      - ReverseProxy__Clusters__alerts__Destinations__primary__Address=http://alert-service:8080/
      - ReverseProxy__Clusters__audit__Destinations__primary__Address=http://audit-service:8080/
      - ReverseProxy__Clusters__events__Destinations__primary__Address=http://event-service:8080/
      - ReverseProxy__Clusters__identity__Destinations__primary__Address=http://identity-service:8080/
      - ReverseProxy__Clusters__monitoring__Destinations__primary__Address=http://monitoring-service:8080/
      - ReverseProxy__Clusters__sensors__Destinations__primary__Address=http://sensor-service:8080/
      - DownstreamHealthEndpoints__6=http://community-service:8080/health
      - ReverseProxy__Clusters__communities__Destinations__primary__Address=http://community-service:8080/
      - ReverseProxy__Routes__communities__ClusterId=communities
      - DownstreamHealthEndpoints__7=http://report-service:8080/health
      - ReverseProxy__Clusters__reports__Destinations__primary__Address=http://report-service:8080/
      - ReverseProxy__Routes__reports__AuthorizationPolicy=Default
      - ReverseProxy__Routes__reports__ClusterId=reports
      - ReverseProxy__Routes__reports__Match__Path=/api/reports/{**remainder}
      - ReverseProxy__Routes__reports__Transforms__0__PathRemovePrefix=/api/reports
      - ReverseProxy__Routes__reports__Transforms__1__PathPrefix=/api/v1/reports
    healthcheck:
      interval: 15s
      retries: 5
      start_period: 10s
      test:
        - CMD
        - dotnet
        - /app/health/Climate.HealthProbe.dll
        - http://localhost:8080/health/ready
      timeout: 10s
    image: climate/gateway:phase3
    networks:
      default: null
    ports:
      - ${GATEWAY_PORT:-8080}:8080
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
  identity-service:
    build:
      context: src\Services\AuthService
      dockerfile: Dockerfile
    depends_on:
      auth-postgres:
        condition: service_healthy
        required: true
    environment:
      ADMIN_SEED_EMAIL: ${ADMIN_SEED_EMAIL:-admin@example.com}
      ADMIN_SEED_PASSWORD: ${AUTH_ADMIN_SEED_PASSWORD:-}
      ADMIN_SEED_USERNAME: ${ADMIN_SEED_USERNAME:-admin}
      AUTH_DATABASE_URL: postgresql://auth:${AUTH_POSTGRES_PASSWORD_URI:?URL-encoded password is required}@auth-postgres:5432/auth
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required}
      JWT_AUDIENCE: ClimateMonitoring.Client
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-60}
      JWT_ISSUER: ClimateMonitoring.Identity
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY is required}
      NODE_ENV: production
      PORT: 8080
      RABBITMQ_URL: amqp://${RABBITMQ_USER_URI:?URL-encoded username is required}:${RABBITMQ_PASSWORD_URI:?URL-encoded password is required}@rabbitmq:5672
    healthcheck:
      interval: 15s
      retries: 10
      start_period: 20s
      test:
        - CMD
        - node
        - -e
        - fetch('http://localhost:8080/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      timeout: 5s
    image: climate/auth:phase3
    networks:
      default: null
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
  monitoring-service:
    build:
      context: .
      dockerfile: src/Services/MonitoringService/Climate.Monitoring.Api/Dockerfile
    depends_on:
      sqlserver:
        condition: service_healthy
        required: true
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=8080
      - AlertService__ApiKey=${INTERNAL_API_KEY}
      - AlertService__BaseUrl=http://alert-service:8080/
      - ConnectionStrings__MonitoringDb=Server=sqlserver,1433;Database=MonitoringDb;User Id=sa;Password=${SQLSERVER_SA_PASSWORD};TrustServerCertificate=True;Encrypt=True
      - EventService__BaseUrl=http://event-service:8080/
      - InternalApi__ApiKey=${INTERNAL_API_KEY:?INTERNAL_API_KEY is required}
      - Jwt__Audience=ClimateMonitoring.Client
      - Jwt__Issuer=ClimateMonitoring.Identity
      - Jwt__SigningKey=${JWT_SIGNING_KEY:?JWT_SIGNING_KEY is required}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER:?RABBITMQ_USER is required}
      - SensorService__ApiKey=${INTERNAL_API_KEY}
      - SensorService__BaseUrl=http://sensor-service:8080/
      - Simulation__Enabled=${SIMULATION_ENABLED:-true}
      - Simulation__IntervalSeconds=${SIMULATION_INTERVAL_SECONDS:-30}
      - CommunityService__BaseUrl=http://community-service:8080/
    healthcheck:
      interval: 15s
      retries: 10
      start_period: 30s
      test:
        - CMD
        - dotnet
        - /app/health/Climate.HealthProbe.dll
      timeout: 5s
    image: climate/monitoring:phase3
    networks:
      default: null
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
  rabbitmq:
    environment:
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER is required}
    healthcheck:
      interval: 10s
      retries: 10
      test:
        - CMD
        - rabbitmq-diagnostics
        - -q
        - ping
      timeout: 5s
    hostname: rabbitmq
    image: rabbitmq:4.1-management
    networks:
      default: null
    restart: unless-stopped
    user: rabbitmq
    volumes:
      - source: rabbitmq-data
        target: /var/lib/rabbitmq
        type: volume
        volume: {}
  report-mongo:
    environment:
      MONGO_INITDB_ROOT_PASSWORD: ${REPORT_MONGO_PASSWORD:?REPORT_MONGO_PASSWORD is required}
      MONGO_INITDB_ROOT_USERNAME: reports
    healthcheck:
      interval: 10s
      retries: 10
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - 'quit(db.adminCommand(''ping'').ok ? 0 : 1)'
      timeout: 5s
    image: mongo:8.0
    networks:
      default: null
    restart: unless-stopped
    volumes:
      - source: report-mongo-data
        target: /data/db
        type: volume
        volume: {}
  report-service:
    build:
      context: .
      dockerfile: src/Services/ReportService/Dockerfile
    cpus: 2
    depends_on:
      report-mongo:
        condition: service_healthy
        required: true
    environment:
      ALERT_SERVICE_URL: http://alert-service:8080/
      AUTH_SERVICE_URL: http://identity-service:8080/
      COMMUNITY_SERVICE_URL: http://community-service:8080/
      EVENT_SERVICE_URL: http://event-service:8080/
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY is required}
      MONGO_DATABASE: reports
      MONGO_URL: mongodb://reports:${REPORT_MONGO_PASSWORD_URI:?URL-encoded report Mongo password is required}@report-mongo:27017/?authSource=admin
      MONITORING_SERVICE_URL: http://monitoring-service:8080/
      RABBITMQ_URL: amqp://${RABBITMQ_USER_URI:?URL-encoded username is required}:${RABBITMQ_PASSWORD_URI:?URL-encoded password is required}@rabbitmq:5672/
      RAINFALL_MODE: ${RAINFALL_MODE:-unknown}
      REPORT_MAX_PENDING_PER_USER: ${REPORT_MAX_PENDING_PER_USER:-3}
      REPORT_MAX_ROWS: ${REPORT_MAX_ROWS:-50000}
      REPORT_RENDER_TIMEOUT_SECONDS: ${REPORT_RENDER_TIMEOUT_SECONDS:-180}
      REPORT_RETENTION_DAYS: ${REPORT_RETENTION_DAYS:-30}
      REPORT_STORAGE_DIRECTORY: /data/reports
      SENSOR_COMMUNICATION_TIMEOUT_SECONDS: ${SENSOR_COMMUNICATION_TIMEOUT_SECONDS:-900}
      SENSOR_SERVICE_URL: http://sensor-service:8080/
    healthcheck:
      interval: 15s
      retries: 10
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8080/health/ready', timeout=3)
      timeout: 5s
    image: climate/reports:phase3
    mem_limit: 1g
    networks:
      default: null
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - source: report-files
        target: /data/reports
        type: volume
        volume: {}
  sensor-service:
    build:
      context: .
      dockerfile: src/Services/SensorService/Climate.Sensors.Api/Dockerfile
    depends_on:
      sqlserver:
        condition: service_healthy
        required: true
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__SensorDb=Server=sqlserver,1433;Database=SensorDb;User Id=sa;Password=${SQLSERVER_SA_PASSWORD};TrustServerCertificate=True;Encrypt=True
      - DemoSeed__Enabled=false
      - InternalApi__ApiKey=${INTERNAL_API_KEY:?INTERNAL_API_KEY is required}
      - Jwt__Audience=ClimateMonitoring.Client
      - Jwt__Issuer=ClimateMonitoring.Identity
      - Jwt__SigningKey=${JWT_SIGNING_KEY:?JWT_SIGNING_KEY is required}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER:?RABBITMQ_USER is required}
      - RealtimeService__ApiKey=${INTERNAL_API_KEY}
      - RealtimeService__BaseUrl=http://monitoring-service:8080/
      - CommunityService__BaseUrl=http://community-service:8080/
      - CommunityService__Enabled=true
    healthcheck:
      interval: 15s
      retries: 10
      start_period: 30s
      test:
        - CMD
        - dotnet
        - /app/health/Climate.HealthProbe.dll
      timeout: 5s
    image: climate/sensors:phase3
    networks:
      default: null
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
  sqlserver:
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SQLSERVER_SA_PASSWORD:?SQLSERVER_SA_PASSWORD is required}
    healthcheck:
      interval: 10s
      retries: 20
      start_period: 30s
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null
      timeout: 5s
    image: mcr.microsoft.com/mssql/server:2022-latest
    networks:
      default: null
    ports:
      - ${SQLSERVER_BIND_ADDRESS:-127.0.0.1}:${SQLSERVER_PORT:-1433}:1433
    restart: unless-stopped
    volumes:
      - source: sqlserver-data
        target: /var/opt/mssql
        type: volume
        volume: {}
volumes:
  alert-postgres-data:
  audit-mongo-data:
  auth-postgres-data:
  community-postgres-data:
  rabbitmq-data:
  report-files:
  report-mongo-data:
  sqlserver-data:
