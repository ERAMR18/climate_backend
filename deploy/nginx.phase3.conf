# Template for a VPS using Nginx instead of the existing Hostinger Traefik.
# Replace climate.example and certificate paths before enabling in http context.
map $http_upgrade $climate_connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 80;
    server_name climate.example;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name climate.example;
    ssl_certificate /etc/letsencrypt/live/climate.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/climate.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 2m;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    location /api/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_read_timeout 60s;
    }
    location /hubs/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $climate_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
    location / {
        proxy_pass http://127.0.0.1:4200;
    }
}
